<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#ffffff" />
    <title>Tego Group</title>
    <meta
      name="description"
      content="Revenue infrastructure for the world's booking platforms. Embed high-margin ancillary products into your checkout with seamless API integration and global scale. Go live in days."
    />
    <meta name="author" content="Tego Group" />

    <link rel="canonical" href="https://www.tego-group.com/" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="Tego Group" />
    <meta property="og:title" content="Tego Group" />
    <meta
      property="og:description"
      content="Revenue infrastructure for the world's booking platforms. Embed high-margin ancillary products into your checkout with seamless API integration and global scale. Go live in days."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.tego-group.com/" />
    <meta property="og:image" content="https://www.tego-group.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:locale" content="en_GB" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tego Group" />
    <meta
      name="twitter:description"
      content="Revenue infrastructure for the world's booking platforms. Embed high-margin ancillary products into your checkout with seamless API integration and global scale. Go live in days."
    />
    <meta name="twitter:image" content="https://www.tego-group.com/og-image.png" />

    <!-- Fonts: load via <link> tags (avoids build-time CSS @import fetches) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

    <div id="root"></div>
